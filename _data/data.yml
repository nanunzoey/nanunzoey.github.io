career-profile:
  title: Research Interests
  summary: |
    - Trustworthy AI in the Physical World: Developing robust and reliable AI systems that can be deployed in complex, high-uncertainty physical environments such as construction sites and industrial facilities.
    - Human-Centric AI Adoption: Investigating methods to enhance user trust and explainability of AI-driven technologies to facilitate seamless integration into traditional industries.
    - Hardware-Software Co-optimization: Bridging the gap between AI software potential and hardware/physical constraints to ensure practical and scalable real-world applications.
    - Industrial Innovation through AI R&D: Leveraging AI to drive digital transformation and structural innovation in various industries.

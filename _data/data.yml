career-profile:
  title: Research Interests
  summary: |
  Guided by four years of AI R&D experience in the construction industry, my research focuses on bridging the "trust gap" and overcoming physical-hardware constraints to implement Trustworthy AI, especially in the Physical World.
  I aim to transcend digital boundaries by developing AI solutions that are both technologically advanced and physically viable.
  - Trustworthy AI for High-Uncertainty Environments: Developing robust, reliable systems for complex physical environments.
  - Human-Centric Adoption & Explainability: Investigating methods to enhance user trust and facilitate seamless AI integration into traditional, high-stakes industries.
  - Hardware-Software Co-optimization: Bridging the gap between software potential and physical constraints to ensure scalable, real-world applicability.
